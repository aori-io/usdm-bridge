name: Publish

# Publishes usdm-bridge-sdk and/or usdm-bridge-widget to npm.
# Bump the package version on the branch first (bun run version:<pkg> <bump>),
# then run this workflow from the Actions tab.
#
# Requires a repository secret: NPM_TOKEN (npm automation / granular token with
# publish rights for the packages).

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package(s) to publish
        required: true
        type: choice
        options:
          - sdk
          - widget
          - all
      tag:
        description: npm dist-tag (usually "latest")
        required: true
        type: string
        default: latest
      dry_run:
        description: Dry-run only (do not publish)
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-shi/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Build packages
        run: bun run build

      - name: Publish
        env:
          # Bun reads the npm token from this env var (same as npm).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          EXTRA=(--access public --tag "${{ inputs.tag }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi

          case "${{ inputs.package }}" in
            sdk)
              bun run publish:sdk -- "${EXTRA[@]}"
              ;;
            widget)
              bun run publish:widget -- "${EXTRA[@]}"
              ;;
            all)
              bun run publish:all -- "${EXTRA[@]}"
              ;;
            *)
              echo "Unknown package: ${{ inputs.package }}"
              exit 1
              ;;
          esac
